<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | P.o.uGfx</title><style>
*{box-sizing:border-box}body{margin:0;background:#070a0f;color:#eef7ff;font-family:Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1250px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}.brand{font-size:24px;font-weight:900}.brand b{color:#00e5ff}.muted{color:#8ca1b5}.login{max-width:430px;margin:10vh auto;background:#0d131c;border:1px solid #1c3040;border-radius:20px;padding:30px;box-shadow:0 20px 80px #0008}.login h1{margin-top:0}.field{display:grid;gap:8px;margin:14px 0}.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #294052;background:#090e15;color:#fff;outline:none}.field textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 16px;background:#00d9ff;color:#001014;font-weight:800}.btn.danger{background:#ff5364;color:white}.btn.gray{background:#1a2632;color:#dbe8f0}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat,.panel{background:#0d131c;border:1px solid #1b2c3a;border-radius:16px;padding:18px}.stat strong{font-size:28px;display:block;color:#00e5ff}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab.active{background:#00d9ff;color:#001014}.tab{background:#14202b;color:#d8edf6}.panel{margin-bottom:18px;overflow:auto}.panel h2{margin-top:0}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{padding:12px;border-bottom:1px solid #1b2c3a;text-align:right;vertical-align:top}.pill{padding:5px 9px;border-radius:99px;background:#172735;font-size:12px}.paid{color:#52f2a0}.unpaid{color:#ffb45c}.actions{display:flex;gap:7px;flex-wrap:wrap}.portfolio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.portfolio-item{background:#0a1017;border:1px solid #20313f;border-radius:14px;overflow:hidden}.portfolio-item img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.portfolio-item div{padding:10px}.msg{min-height:22px;color:#6ff5ff}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:15px}}
</style></head><body><div id="login" class="login"><div class="brand">P.o.u<b>Gfx</b> Admin <small style="opacity:.5">v6</small></div><p class="muted">ورود به پنل مدیریت</p><form id="loginForm"><label class="field">نام کاربری<input id="username" required></label><label class="field">رمز عبور<input id="password" type="password" required></label><button class="btn" style="width:100%">ورود</button><p id="loginMsg" class="msg"></p></form></div>
<div id="app" class="hidden"><div class="wrap"><div class="top"><div><div class="brand">P.o.u<b>Gfx</b> Admin <small style="opacity:.5">v6</small></div><span class="muted">مدیریت سفارش‌ها، پرداخت‌ها، تیکت‌ها و نمونه‌کارها</span></div><button class="btn gray" id="logout">خروج</button></div><div class="stats"><div class="stat"><span class="muted">کل سفارش‌ها</span><strong id="sOrders">0</strong></div><div class="stat"><span class="muted">پرداخت‌شده</span><strong id="sPaid">0</strong></div><div class="stat"><span class="muted">در حال انجام</span><strong id="sPending">0</strong></div><div class="stat"><span class="muted">تیکت باز</span><strong id="sTickets">0</strong></div></div><div class="tabs"><button class="btn tab active" data-tab="orders">سفارش‌ها</button><button class="btn tab" data-tab="portfolio">نمونه‌کارها</button><button class="btn tab" data-tab="tickets">تیکت‌ها</button></div>
<section id="orders" class="panel"><h2>سفارش‌ها</h2><div id="ordersBox" class="muted">در حال بارگذاری...</div></section>
<section id="portfolio" class="panel hidden"><h2>افزودن نمونه‌کار</h2><form id="portfolioForm" enctype="multipart/form-data"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px"><label class="field">عنوان<input name="title" placeholder="مثلاً Bedwars #01"></label><label class="field">دسته<select name="category"><option value="bedwars">بدوارز</option><option value="survival">سروایول</option><option value="hardcore">هاردکورد</option><option value="all">همه</option></select></label><label class="field">تصویر<input name="image" type="file" accept="image/png,image/jpeg,image/webp" required></label></div><button class="btn">افزودن نمونه</button><p id="portfolioMsg" class="msg"></p></form><hr style="border-color:#1b2c3a"><div id="portfolioBox" class="portfolio-grid"></div></section>
<section id="tickets" class="panel hidden"><h2>تیکت‌ها</h2><div id="ticketsBox" class="muted">در حال بارگذاری...</div></section></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);const API_BASE=(location.protocol==='file:')?'http://localhost:3001':'';async function api(url,opt){const r=await fetch(API_BASE+url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'خطا');return d}
async function check(){const d=await api('/api/admin/me');if(d.loggedIn){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');loadAll()}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#username').value,password:$('#password').value})});$('#login').classList.add('hidden');$('#app').classList.remove('hidden');loadAll()}catch(x){$('#loginMsg').textContent=x.message}};
$('#logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['orders','portfolio','tickets'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==b.dataset.tab));if(b.dataset.tab==='portfolio')loadPortfolio();if(b.dataset.tab==='tickets')loadTickets()});
async function loadAll(){const s=await api('/api/admin/stats');$('#sOrders').textContent=s.orders;$('#sPaid').textContent=s.paid;$('#sPending').textContent=s.pending;$('#sTickets').textContent=s.tickets;loadOrders();loadPortfolio();loadTickets()}
function paymentLabel(s){return ({paid:'پرداخت تأیید شده',awaiting_receipt:'در انتظار رسید',receipt_submitted:'رسید ارسال شده',rejected:'رسید رد شده',unpaid:'پرداخت نشده'}[s]||s||'نامشخص')}
async function approvePayment(id){if(!confirm('پرداخت این سفارش تأیید شود؟'))return;await api('/api/admin/orders/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({payment_status:'paid'})});loadAll()}
async function rejectPayment(id){if(!confirm('رسید این سفارش رد شود؟'))return;await api('/api/admin/orders/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({payment_status:'rejected'})});loadAll()}
async function loadOrders(){const rows=await api('/api/admin/orders');if(!rows.length){$('#ordersBox').textContent='هنوز سفارشی ثبت نشده.';return}$('#ordersBox').innerHTML='<table class="table"><thead><tr><th>#</th><th>مشتری</th><th>ارتباط</th><th>سرویس</th><th>مبلغ</th><th>پرداخت</th><th>رسید</th><th>اسکین</th><th>وضعیت</th><th>تاریخ</th><th>حذف</th></tr></thead><tbody>'+rows.map(o=>`<tr><td>#${o.id}</td><td>${esc(o.customer_name)}<br><small>${esc(o.description||'')}</small></td><td>${o.contact_type==='rubika'?'روبیکا':'Discord'}<br>${esc(o.contact_value)}</td><td>${esc(o.service)}</td><td>${Number(o.price).toLocaleString('fa-IR')} تومان</td><td class="${o.payment_status==='paid'?'paid':'unpaid'}">${paymentLabel(o.payment_status)}${o.ref_id?'<br>Ref: '+esc(o.ref_id):''}<br>${o.receipt_image||o.receipt_text?`<button class="btn" onclick="approvePayment(${o.id})">تأیید پرداخت</button> <button class="btn danger" onclick="rejectPayment(${o.id})">رد رسید</button>`:''}</td><td>${o.receipt_image?`<a href="${o.receipt_image}" target="_blank">مشاهده عکس رسید</a>`:'بدون عکس'}${o.receipt_text?`<details style="margin-top:8px"><summary>متن واریز</summary><div style="white-space:pre-wrap;max-width:280px">${esc(o.receipt_text)}</div></details>`:''}</td><td>${o.skin_file?`<a href="${o.skin_file}" target="_blank">مشاهده فایل</a>`:'ندارد'}</td><td><select onchange="setOrder(${o.id},this.value)"><option ${o.status==='pending'?'selected':''} value="pending">در انتظار</option><option ${o.status==='processing'?'selected':''} value="processing">در حال انجام</option><option ${o.status==='completed'?'selected':''} value="completed">تکمیل شد</option><option ${o.status==='cancelled'?'selected':''} value="cancelled">لغو شد</option></select></td><td>${esc(o.created_at)}</td><td><button class="btn danger" onclick="deleteOrder(${o.id})">حذف سفارش</button></td></tr>`).join('')+'</tbody></table>'}
async function deleteOrder(id){if(!confirm('این سفارش برای همیشه حذف شود؟'))return;await api('/api/admin/orders/'+id,{method:'DELETE'});loadAll()}
async function setOrder(id,status){await api('/api/admin/orders/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});loadAll()}
async function loadPortfolio(){const rows=await api('/api/admin/portfolio');$('#portfolioBox').innerHTML=rows.map(x=>`<div class="portfolio-item"><img src="${x.image}"><div><b>${esc(x.title)}</b><br><small class="muted">${esc(x.category)}</small><br><button class="btn danger" onclick="delPortfolio(${x.id})">حذف</button></div></div>`).join('')||'<p class="muted">هنوز نمونه‌ای اضافه نشده.</p>'}
$('#portfolioForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{await api('/api/admin/portfolio',{method:'POST',body:fd});$('#portfolioMsg').textContent='نمونه‌کار اضافه شد.';e.target.reset();loadPortfolio()}catch(x){$('#portfolioMsg').textContent=x.message}}
async function delPortfolio(id){if(!confirm('این نمونه حذف شود؟'))return;await api('/api/admin/portfolio/'+id,{method:'DELETE'});loadPortfolio()}
async function loadTickets(){const rows=await api('/api/admin/tickets');$('#ticketsBox').innerHTML=rows.length?'<table class="table"><thead><tr><th>#</th><th>ارتباط</th><th>موضوع</th><th>آخرین پیام</th><th>وضعیت</th><th>تاریخ</th><th>عملیات</th></tr></thead><tbody>'+rows.map(t=>{const msgs=t.messages||[{from:'customer',message:t.message,created_at:t.created_at}];const last=msgs[msgs.length-1];return `<tr><td>#${t.id}</td><td>${t.contact_type==='rubika'?'روبیکا':'Discord'}<br>${esc(t.contact_value)}</td><td>${esc(t.subject)}</td><td><b>${last.from==='admin'?'شما':'مشتری'}:</b> ${esc(last.message)}</td><td><select onchange="setTicket(${t.id},this.value)"><option ${t.status==='open'?'selected':''} value="open">باز</option><option ${t.status==='closed'?'selected':''} value="closed">بسته</option></select></td><td>${esc(t.created_at)}</td><td><div class="actions"><button class="btn" onclick="openTicketChat(${t.id})">باز کردن تیکت</button><button class="btn danger" onclick="deleteTicket(${t.id})">حذف</button></div></td></tr>`}).join('')+'</tbody></table>':'<p>تیکتی وجود ندارد.</p>'}
async function openTicketChat(id){const t=await api('/api/admin/tickets');const x=t.find(v=>v.id===id);if(!x)return;const msgs=x.messages||[{from:'customer',message:x.message,created_at:x.created_at}];let html=`<div class="ticket-chat"><h3>تیکت #${x.id} — ${esc(x.subject)}</h3><div class="muted" style="margin-bottom:12px">${x.contact_type==='rubika'?'روبیکا':'Discord'}: ${esc(x.contact_value)}</div><div id="chatMessages" style="max-height:360px;overflow:auto;background:#081018;border:1px solid #20313f;border-radius:12px;padding:12px">${msgs.map(m=>`<div style="padding:10px 12px;margin-bottom:8px;border-radius:10px;background:${m.from==='admin'?'#102a35':'#141c25'}"><b>${m.from==='admin'?'شما':'مشتری'}</b><div style="white-space:pre-wrap;margin-top:5px">${esc(m.message)}</div><small class="muted">${esc(m.created_at)}</small></div>`).join('')}</div><textarea id="chatReply" placeholder="پاسخ خودت را بنویس..." style="margin-top:12px"></textarea><div class="actions" style="margin-top:8px"><button class="btn" onclick="sendTicketReply(${x.id})">ارسال پاسخ</button><button class="btn gray" onclick="closeTicketChat()">بستن</button></div><p id="chatMsg" class="msg"></p></div>`;let box=document.getElementById('ticketChatOverlay');if(!box){box=document.createElement('div');box.id='ticketChatOverlay';box.style='position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99';document.body.appendChild(box)}box.innerHTML='<div style="width:min(760px,100%);max-height:90vh;overflow:auto;background:#0d151d;border:1px solid #274253;border-radius:18px;padding:20px">'+html+'</div>'}
async function sendTicketReply(id){const msg=$('#chatReply').value.trim();if(!msg)return;try{await api('/api/admin/tickets/'+id+'/reply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});openTicketChat(id);loadAll()}catch(e){$('#chatMsg').textContent=e.message}}
function closeTicketChat(){document.getElementById('ticketChatOverlay')?.remove()}
async function deleteTicket(id){if(!confirm('این تیکت برای همیشه حذف شود؟'))return;await api('/api/admin/tickets/'+id,{method:'DELETE'});loadAll()}
async function setTicket(id,status){await api('/api/admin/tickets/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});loadAll()}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}check();
</script></body></html>
